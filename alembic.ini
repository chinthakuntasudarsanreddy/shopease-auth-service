
# ShopEase Authentication Service - Alembic Configuration

[alembic]

script_location = %(here)s/alembic

prepend_sys_path = .

path_separator = os

# Database URL is loaded securely from app/core/config.py
# through alembic/env.py
sqlalchemy.url = mysql+pymysql://placeholder:placeholder@localhost/placeholder


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
